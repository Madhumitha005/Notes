<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes</title>
<style>
    /* Reset & Body */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1a002d, #3a0a5a);
        color: white;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 2rem;
        letter-spacing: 1px;
    }

    /* Input Section */
    .input-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 20px;
        width: 100%;
        max-width: 600px;
    }

    #task-input {
        flex: 1 1 250px;
        padding: 12px 15px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        outline: none;
    }

    #add-btn {
        padding: 12px 20px;
        margin-left: 10px;
        margin-top: 10px;
        background: #61dafb;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        color: #1a002d;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    #add-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Tasks List */
    #tasks {
        list-style: none;
        width: 100%;
        max-width: 600px;
        padding: 0;
    }

    .task {
        background: rgba(255, 255, 255, 0.1);
        padding: 15px 20px;
        margin-bottom: 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.3s, transform 0.2s;
    }

    .task:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
    }

    /* Responsive */
    @media(max-width: 480px){
        #task-input {
            flex: 1 1 100%;
            margin-bottom: 10px;
        }
        #add-btn {
            flex: 1 1 100%;
            margin-left: 0;
        }
    }
</style>
</head>
<body>

<h1>My Notes</h1>

<div class="input-container">
    <input type="text" id="task-input" placeholder="Add a new task">
    <button id="add-btn">Add</button>
</div>

<ul id="tasks"></ul>

<script>
    const taskInput = document.getElementById('task-input');
    const addBtn = document.getElementById('add-btn');
    const taskList = document.getElementById('tasks');

    function createTask(taskText){
        const li = document.createElement('li');
        li.className = 'task';
        li.textContent = taskText;

        // Long press for delete confirmation only
        let pressTimer;
        li.addEventListener('mousedown', () => {
            pressTimer = setTimeout(() => {
                if(confirm("Do you want to delete this task?")){
                    li.remove();
                }
            }, 700); // long press 700ms
        });
        li.addEventListener('mouseup', () => clearTimeout(pressTimer));
        li.addEventListener('mouseleave', () => clearTimeout(pressTimer));

        taskList.appendChild(li);
    }

    addBtn.addEventListener('click', () => {
        const taskText = taskInput.value.trim();
        if(!taskText) return;
        createTask(taskText);
        taskInput.value = '';
    });

    taskInput.addEventListener('keypress', (e) => {
        if(e.key === 'Enter'){
            addBtn.click();
        }
    });
</script>

</body>
</html>
