<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes App</title>

<style>
    body {
        background: linear-gradient(135deg, #1a002d, #3a0a5a);
        font-family: Arial, sans-serif;
        color: white;
        min-height: 100vh;
        padding: 20px;
        text-align: center;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 15px;
    }

    .input-area {
        display: flex;
        justify-content: center;
        gap: 10px;
        max-width: 600px;
        margin: auto;
    }

    #noteInput {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    button {
        padding: 12px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    #addBtn {
        background: #61dafb;
        color: #000;
    }

    ul {
        list-style: none;
        padding: 0;
        max-width: 600px;
        margin: 20px auto;
    }

    li {
        background: rgba(255,255,255,0.1);
        padding: 14px;
        margin-bottom: 12px;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .btns button {
        margin-left: 8px;
    }

    .edit { background: #00ffae; color: #000; }
    .delete { background: #ff4d4d; color: #fff; }
    .save { background: #33ff77; color: black; }
</style>

</head>
<body>

<h1>Notes App</h1>

<div class="input-area">
    <input type="text" id="noteInput" placeholder="Type a note...">
    <button id="addBtn">Add</button>
</div>

<ul id="notesList"></ul>

<script>
    const noteInput = document.getElementById("noteInput");
    const addBtn = document.getElementById("addBtn");
    const notesList = document.getElementById("notesList");

    // Load saved notes from localStorage
    let notes = JSON.parse(localStorage.getItem("notes")) || [];

    function saveNotes() {
        localStorage.setItem("notes", JSON.stringify(notes));
    }

    function renderNotes() {
        notesList.innerHTML = "";

        notes.forEach((note, index) => {
            const li = document.createElement("li");

            if (note.isEditing) {
                li.innerHTML = `
                    <input type="text" value="${note.text}" id="edit-${index}">
                    <div class="btns">
                        <button class="save" onclick="saveEdit(${index})">Save</button>
                        <button class="delete" onclick="deleteNote(${index})">Delete</button>
                    </div>
                `;
            } else {
                li.innerHTML = `
                    <span>${note.text}</span>
                    <div class="btns">
                        <button class="edit" onclick="editNote(${index})">Edit</button>
                        <button class="delete" onclick="deleteNote(${index})">Delete</button>
                    </div>
                `;
            }

            notesList.appendChild(li);
        });
    }

    function addNote() {
        const text = noteInput.value.trim();
        if (!text) return;

        notes.push({ text, isEditing: false });
        noteInput.value = "";
        saveNotes();
        renderNotes();
    }

    function deleteNote(index) {
        notes.splice(index, 1);
        saveNotes();
        renderNotes();
    }

    function editNote(index) {
        notes[index].isEditing = true;
        saveNotes();
        renderNotes();
    }

    function saveEdit(index) {
        const newText = document.getElementById(`edit-${index}`).value;
        notes[index] = { text: newText, isEditing: false };
        saveNotes();
        renderNotes();
    }

    addBtn.addEventListener("click", addNote);

    noteInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") addNote();
    });

    // Initial load
    renderNotes();
</script>

</body>
</html>
