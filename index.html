<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes</title>
<style>
/* Body & Background */
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1a002d, #3a0a5a);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    overflow: hidden;
}

/* App Title */
h1 {
    font-size: 3rem;
    margin-bottom: 50px;
    text-align: center;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
}

/* Loading Text */
.loading-text {
    font-size: 1.2rem;
    margin-bottom: 30px;
    letter-spacing: 1px;
    opacity: 0.8;
}

/* Progress Bar Container */
.progress-container {
    width: 250px;
    height: 15px;
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    overflow: hidden;
}

/* Progress Bar Fill */
.progress-fill {
    width: 0;
    height: 100%;
    background: #61dafb;
    border-radius: 10px;
    animation: fillProgress 3s forwards;
}

/* Animate progress fill */
@keyframes fillProgress {
    0% { width: 0; }
    100% { width: 100%; }
}

/* Responsive */
@media(max-width: 480px) {
    h1 { font-size: 2rem; margin-bottom: 30px; }
    .progress-container { width: 180px; height: 12px; }
}
</style>
</head>
<body>

<h1>My Notes</h1>

<div class="loading-text">Loading your notes...</div>

<div class="progress-container">
    <div class="progress-fill"></div>
</div>

<script>
    // Redirect after 3s
    setTimeout(() => {
        window.location.href = 'notes.html';
    }, 3000);
</script>

</body>
</html>
